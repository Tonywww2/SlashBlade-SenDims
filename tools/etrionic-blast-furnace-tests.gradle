// Run: gradlew --offline -I tools/etrionic-blast-furnace-tests.gradle -PexcludeGiselleFromServerRuntime runGameTestServer
allprojects {
    afterEvaluate { project ->
        if (project != rootProject) return
        sourceSets {
            blastingGameTest {
                java.srcDir 'src/gameTest/java'
                compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
                runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
            }
        }
        tasks.named('processBlastingGameTestResources', ProcessResources).configure {
            from('src/main/resources/data/slashblade_sendims/structures/holy_sword_test.nbt') {
                into 'data/sendims_blasting_test/structures'
                rename { 'blast_furnace_test.nbt' }
            }
        }
        def testRun = layout.buildDirectory.dir('etrionic-blast-furnace-gametest/run')
        minecraft.runs.gameTestServer {
            workingDirectory testRun.get().asFile
            property 'forge.enabledGameTestNamespaces', 'sendims_blasting_test'
            property 'fml.maxParallelism', '1'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { slashblade_sendims { source sourceSets.blastingGameTest } }
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            dependsOn tasks.named('blastingGameTestClasses')
            doFirst {
                // Avoid unrelated mods' first-run config generation races in this isolated world.
                copy {
                    from 'run/config/NuclearCraft'
                    into new File(testRun.get().asFile, 'config/NuclearCraft')
                }
            }
        }
    }
}
